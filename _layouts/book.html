---
layout: default
---
<article class="book">
  <header class="book-header">
    <h1 class="book-title">{{ page.title }}</h1>
    <p class="book-meta">
      {% if page.author %}<span class="book-author">{{ page.author }}</span>{% endif %}
    </p>
  </header>

  <div class="book-body">
    {{ content }}
  </div>

  <p class="back"><a href="{{ '/books/' | relative_url }}">← All reviews</a></p>
</article>
