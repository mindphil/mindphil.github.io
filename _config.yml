title: "My Book Journal"
description: "Thoughts on what I've read, and a list of what's next."
author: "Philip Umeadi"

# Leave url/baseurl blank for a site served at https://<username>.github.io
# If publish to https://<username>.github.io/<repo>/ instead, set:
#   baseurl: "/<repo>"
url: ""
baseurl: ""

# Book reviews live in _books/ as their own collection,
# so each one gets a clean page at /books/<filename>/.
collections:
  books:
    output: true
    permalink: /books/:name/

# Apply the "book" layout to everything in _books/ automatically,
# so individual review files don't need to declare a layout.
defaults:
  - scope:
      path: ""
      type: books
    values:
      layout: book

# Files Jekyll should ignore when building.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
